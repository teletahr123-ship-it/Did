name: Telegram Bot Runner

on:
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً من زار Run workflow في غيتهاب
  schedule:
    - cron: '0 */5 * * *' # إعادة تشغيل البوت كل 5 ساعات تلقائياً لضمان استمراريته

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Telegram Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.BOT_TOKEN }} # سنشرح كيف تضع التوكن بأمان
      run: |
        python bot.py
